<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Inventory Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Bot Inventory Tracker</h1>
    <span id="status" class="status disconnected">RCON Disconnected</span>
  </header>

  <div id="app">
    <aside id="player-list">
      <h2>Players</h2>
      <ul id="players"></ul>
    </aside>

    <main id="detail">
      <div id="no-selection">
        <p>Select a player to view inventory</p>
      </div>
      <div id="player-detail" class="hidden">
        <h2 id="player-name"></h2>
        <div id="player-legend" class="player-legend-info"></div>

        <!-- Vitals + abilities -->
        <section class="vitals">
          <div class="bar-group">
            <label>HP</label>
            <div class="bar-container"><div id="hp-bar" class="bar hp"></div></div>
            <span id="hp-text"></span>
          </div>
          <div class="bar-group">
            <label>Shields</label>
            <div class="bar-container"><div id="shield-bar" class="bar shield"></div></div>
            <span id="shield-text"></span>
          </div>
          <div class="bar-group">
            <label>Tactical</label>
            <div class="bar-container"><div id="tac-bar" class="bar tactical"></div></div>
            <span id="tac-text"></span>
          </div>
          <div class="bar-group">
            <label>Ultimate</label>
            <div class="bar-container"><div id="ult-bar" class="bar ultimate"></div></div>
            <span id="ult-text"></span>
          </div>
        </section>

        <!-- Weapons row: side by side -->
        <div class="weapons-row">
          <div class="weapon-card" id="weapon-0">
            <div class="weapon-icon-area"></div>
            <div class="weapon-name"></div>
            <div class="weapon-bottom">
              <div class="weapon-mods"></div>
              <div class="weapon-ammo"></div>
            </div>
          </div>
          <div class="weapon-card" id="weapon-1">
            <div class="weapon-icon-area"></div>
            <div class="weapon-name"></div>
            <div class="weapon-bottom">
              <div class="weapon-mods"></div>
              <div class="weapon-ammo"></div>
            </div>
          </div>
        </div>

        <!-- Backpack grid -->
        <div class="backpack-grid" id="backpack-grid"></div>

        <!-- Equipment row: armor, helmet, backpack, KD shield -->
        <div class="equip-row">
          <div class="equip-slot" id="slot-armor"><span class="slot-value"></span></div>
          <div class="equip-slot" id="slot-helmet"><span class="slot-value"></span></div>
          <div class="equip-slot" id="slot-backpack"><span class="slot-value"></span></div>
          <div class="equip-slot" id="slot-knockdown"><span class="slot-value"></span></div>
        </div>

        <!-- Debug panel -->
        <div id="debug-panel" class="debug-panel"></div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
